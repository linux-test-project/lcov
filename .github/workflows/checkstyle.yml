name: Enforce checkstyle-clean code

on:
  pull_request:
  push:
  schedule:
    - cron: '0 14 * * 5'  # Every Friday 2pm
  workflow_dispatch:

# Drop permissions to minimum for security
permissions:
  contents: read

jobs:
  checkstyle:
    name: Enforce checkstyle-clean code
    runs-on: ubuntu-24.04
    steps:
      - name: Install perltidy
        run: |-
          set -x
          sudo apt-get update
          sudo apt-get install --yes -V --no-install-recommends \
              cpanminus

          # NOTE: We install a pinned version to ensure robust CI
          sudo cpanm --notest \
              https://github.com/perltidy/perltidy/archive/refs/tags/20260705.01.tar.gz

      - uses: actions/checkout@v7

      - name: Enforce "make checkstyle"
        id: check
        run: |-
          set -x
          perltidy --version | grep -o 'v2.*'

          MODE=full make checkstyle

      # the check above only reports:  on failure, let perltidy rewrite the
      #   offending files and hand back the corrected files (plus a patch)
      - name: Apply checkstyle fixes
        id: fix
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        run: |-
          set -x -o pipefail
          # exit status is nonzero whenever a file was updated
          MODE=full make checkstyle UPDATE=1 || true
          # the updated files are moved in from *.tdy:  ignore mode changes
          git config core.fileMode false
          if git diff --quiet ; then
            exit 0
          fi
          mkdir "${RUNNER_TEMP}/checkstyle-fixes"
          git diff > "${RUNNER_TEMP}/checkstyle-fixes/checkstyle.patch"
          git diff --name-only -z \
            | xargs -0 cp --parents -t "${RUNNER_TEMP}/checkstyle-fixes"
          echo 'changed=true' >> "${GITHUB_OUTPUT}"

      - name: Upload checkstyle fixes as an artifact
        if: ${{ failure() && steps.fix.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: "lcov-${{ github.sha }}-checkstyle-fixes"  # .zip
          path: ${{ runner.temp }}/checkstyle-fixes
          if-no-files-found: error
